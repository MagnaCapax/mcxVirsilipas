name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        # Third-party action, pinned to a commit: tag 2.40.0 (= v2 on 2026-10-17).
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, pdo_sqlite, ctype
          coverage: none
          # Every error, notice and deprecation shows; the suite also fails on any Deprecated or Warning
          # line in a test server's log.
          ini-values: error_reporting=-1, display_errors=On

      - name: PHP syntax lint
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
          php -l bin/virsilipas > /dev/null

      - name: Test suite (unit, end-to-end and load smoke)
        env:
          # Deployment-specific words the secret guard refuses in the tree (kept out of the repo). Required on
          # pushes and same-repository pull requests; a pull request from a fork gets no secrets, so there the
          # guard runs its other checks without the word list.
          VIRSILIPAS_FORBIDDEN_WORDS: ${{ secrets.VIRSILIPAS_FORBIDDEN_WORDS }}
          VIRSILIPAS_REQUIRE_FORBIDDEN_WORDS: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
        run: |
          set -o pipefail
          php tests/run.php 2>&1 | tee test-output.log

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-php${{ matrix.php }}
          path: test-output.log

  phpstan:
    # Advisory: findings are shown but do not fail the build.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        # Pinned as in the test job: tag 2.40.0.
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2'
          extensions: curl, pdo_sqlite, ctype
          coverage: none

      - name: PHPStan (advisory, level 5)
        run: |
          curl -sSL -o phpstan.phar https://github.com/phpstan/phpstan/releases/download/1.12.7/phpstan.phar
          # sha512 of the 1.12.7 release phar (a sha256 would look like a token hash to the secret guard).
          echo '2196d89bc710105c428e40a3bd7ace8187fc494c966795d36bec8ec4adcd7e3abf9455e7e51c88782f7514e59ad54777bab4751e45f07a0182de297b2d665728  phpstan.phar' > phpstan.sha512
          sha512sum -c phpstan.sha512
          php phpstan.phar analyse --no-progress --level=5 src public tools bin/virsilipas
